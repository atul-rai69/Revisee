<aside class="sidebar-panel" aria-label="Primary application navigation">
  <div class="sidebar-top">
    <a routerLink="/app/dashboard" class="brand-link" aria-label="Revisee Home">
      <img class="brand-logo" src="/assets/revisee-brand-kit/revisee-logo-primary.svg" alt="Revisee">
      <img class="brand-mark" src="/assets/revisee-brand-kit/revisee-mark.svg" alt="">
    </a>
    <nav class="nav-menu" aria-label="Primary">
      @for (item of navigation; track item.route) {
        <a
          #activeLink="routerLinkActive"
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.aria-current]="activeLink.isActive ? 'page' : null"
          [attr.title]="collapsed() ? item.label : null"
        >
          <i [class]="'ph ' + item.icon" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
  <div class="sidebar-bottom">
    <button type="button" class="sidebar-action logout-action" (click)="onLogout()" title="Log out">
      <i class="ph ph-sign-out" aria-hidden="true"></i><span>Log out</span>
    </button>
    <button
      type="button"
      class="sidebar-action collapse-action"
      [attr.aria-label]="collapsed() ? 'Expand navigation' : 'Collapse navigation'"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggleCollapsed()"
    >
      <i class="ph" [class.ph-caret-double-left]="!collapsed()" [class.ph-caret-double-right]="collapsed()" aria-hidden="true"></i>
      <span>Collapse</span>
    </button>
  </div>
</aside>
