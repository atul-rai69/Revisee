@if (loader.isLoading()) {
  <div
    class="loader-overlay"
    role="status"
    aria-live="polite"
    aria-label="Loading"
  >
    <div class="loader-container">
      <div class="loader-notebook" aria-hidden="true">
        <span class="loader-page"></span>
        <span class="loader-line"></span>
      </div>
      <span class="loader-text">Preparing your study space…</span>
    </div>
  </div>
}
